title:
  en_us: 'Param\nAutoFill\n(Fast)'
tooltip:
  en_us: |
    Auto-fill NWB asset and WBS parameters for MEP elements — OPTIMIZED VERSION.

    Same features as standard version with significant speed improvements:
    - Deferred parameter verification (post-commit)
    - Parameter resolution caching
    - Asset row matching caching
    - Linked room search optimization

    Works from:
    - active model views (current visible MEP elements)
    - active schedule views (scheduled elements)

    Reads mapping data from:
    - Asset Master sheet
    - WBS sheet

    Supports:
    - Skip existing values
    - Override existing values
    - Live progress monitor with cancel

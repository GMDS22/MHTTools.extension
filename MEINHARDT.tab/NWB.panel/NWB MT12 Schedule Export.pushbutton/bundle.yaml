title:
  en_us: 'MT Types\nExport'
tooltip:
  en_us: |
    Export a fast NWB schedule for all eligible MEP elements whose matched
    Asset Master row is Building Services and matches the maintainability
    types you choose at runtime.

    The export reads only shared NWB parameters when duplicate parameter names
    exist and sorts the output by NWB category, Revit type, family, and element ID.

    Saves a timestamped Excel workbook beside this tool in its logs folder.
author: GM

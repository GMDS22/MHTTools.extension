title:
  en_us: 'Rooms\nExporter'
tooltip:
  en_us: |
    Export room information from loaded linked architectural models to CSV.

    The exporter is read-only and captures room names, numbers, departments,
    building/site hints, and populated room parameters for NWB mapping and QA.

    Saves a timestamped CSV beside Param AutoFill in the NWB panel.
